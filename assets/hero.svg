<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t">
  <title id="t">Hafrannio Menezes, Engenharia de Software, backend e banco de dados</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#121a2b"/>
    </linearGradient>
    <linearGradient id="nome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.12" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilho2" cx="0.9" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c2433" stroke-width="1"/>
    </pattern>
    <clipPath id="borda"><rect width="1200" height="400" rx="18"/></clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, Menlo, "Courier New", monospace; }
    .linha { opacity: 0; animation: aparece .35s ease-out forwards; }
    .l1 { animation-delay: .4s; }  .l2 { animation-delay: 1.0s; }
    .l3 { animation-delay: 1.7s; } .l4 { animation-delay: 2.3s; }
    .l5 { animation-delay: 3.0s; } .l6 { animation-delay: 3.6s; }
    .l7 { animation-delay: 4.2s; }
    .cursor { animation: pisca 1s step-end infinite; }
    .entra { opacity: 0; animation: aparece .6s ease-out forwards; }
    .e1 { animation-delay: .1s; } .e2 { animation-delay: .3s; } .e3 { animation-delay: .5s; } .e4 { animation-delay: .7s; }
    @keyframes aparece { to { opacity: 1; } }
    @keyframes pisca { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#borda)">
    <rect width="1200" height="400" fill="url(#fundo)"/>
    <rect width="1200" height="400" fill="url(#grade)" opacity="0.55"/>
    <rect width="1200" height="400" fill="url(#brilho)"/>
    <rect width="1200" height="400" fill="url(#brilho2)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="18" fill="none" stroke="#30363d"/>

  <!-- lado esquerdo -->
  <text x="64" y="118" class="mono entra e1" font-size="18" fill="#7d8590">// olá, eu sou</text>
  <text x="62" y="188" class="sans entra e2" font-size="58" font-weight="800" fill="url(#nome)">Hafrannio Menezes</text>
  <text x="64" y="236" class="sans entra e3" font-size="23" fill="#e6edf3">Engenharia de Software · Backend &amp; Banco de Dados</text>
  <text x="64" y="272" class="sans entra e3" font-size="17" fill="#8b949e">APIs, modelagem de dados e arquitetura de software</text>

  <g class="sans entra e4" font-size="15" font-weight="600">
    <rect x="64" y="300" width="84" height="32" rx="16" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="106" y="321" text-anchor="middle" fill="#67e8f9">Python</text>
    <rect x="158" y="300" width="118" height="32" rx="16" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="217" y="321" text-anchor="middle" fill="#7dd3fc">TypeScript</text>
    <rect x="286" y="300" width="70" height="32" rx="16" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="321" y="321" text-anchor="middle" fill="#a5b4fc">Java</text>
    <rect x="366" y="300" width="120" height="32" rx="16" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="426" y="321" text-anchor="middle" fill="#c4b5fd">PostgreSQL</text>
  </g>

  <!-- terminal -->
  <g transform="translate(690 58)">
    <rect width="450" height="284" rx="12" fill="#0a0e14" stroke="#30363d"/>
    <path d="M12 0H438A12 12 0 0 1 450 12V36H0V12A12 12 0 0 1 12 0Z" fill="#161b22"/>
    <line x1="0" y1="36" x2="450" y2="36" stroke="#30363d"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="6" fill="#febc2e"/>
    <circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text x="225" y="23" text-anchor="middle" class="mono" font-size="13" fill="#7d8590">hafrannio@dev: ~</text>

    <g class="mono" font-size="15">
      <text x="22" y="74" class="linha l1"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
      <text x="22" y="100" class="linha l2" fill="#79c0ff">hafrannio · estudante de eng. de software</text>
      <text x="22" y="138" class="linha l3"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3"> cat stack.txt</tspan></text>
      <text x="22" y="164" class="linha l4" fill="#d2a8ff">python  django  node  typescript  java</text>
      <text x="22" y="202" class="linha l5"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3"> git commit -m "aprendendo todo dia"</tspan></text>
      <text x="22" y="228" class="linha l6" fill="#8b949e">[main] mais um passo pra frente</text>
      <g class="linha l7">
        <text x="22" y="262"><tspan fill="#7ee787">$</tspan></text>
        <rect x="38" y="249" width="9" height="17" fill="#e6edf3" class="cursor"/>
      </g>
    </g>
  </g>
</svg>
